# Imagem da Central NexAi: constrói o Dockerfile oficial do Chatwoot a partir de uma tag vX.Y.Z-nexai.N
# e publica em ghcr.io/nexaicorp/chatwoot:<tag>. Os workflows do upstream ficam desativados neste fork.
name: Imagem NexAi
on:
  push:
    tags: ['v*-nexai.*']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/nexaicorp/chatwoot:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
